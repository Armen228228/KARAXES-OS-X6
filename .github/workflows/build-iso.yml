
name: KARAXES OS X6 ISO Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build KARAXES OS X6
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: |
          mkdir -p output
          sudo chmod 777 "$GITHUB_WORKSPACE"

      - name: Build KARAXES OS X6
        run: |
          docker run --rm \
            --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                live-build \
                debootstrap \
                debian-archive-keyring \
                ca-certificates \
                xorriso \
                squashfs-tools \
                grub-pc-bin \
                grub-efi-amd64-bin \
                syslinux \
                syslinux-common \
                isolinux \
                mtools \
                dosfstools \
                wget \
                curl \
                file

              rm -rf config chroot binary .build

              mkdir -p config/package-lists
              mkdir -p config/includes.chroot/usr/local/bin
              mkdir -p config/includes.chroot/usr/share/applications
              mkdir -p output

              cat > config/package-lists/karaxes.list.chroot << "EOF"
          live-boot
          live-config
          live-config-systemd
          linux-image-amd64
          firmware-linux
          firmware-linux-nonfree
          firmware-misc-nonfree
          network-manager
          sudo
          systemd
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          firefox-esr
          thunar
          mousepad
          gvfs
          pavucontrol
          alsa-utils
          pipewire
          wireplumber
          fonts-dejavu
          locales
          xserver-xorg-video-nouveau
          python3
          python3-gi
          gir1.2-gtk-4.0
          EOF

              test -f karaxes-shell.py
              test -f karaxes-shell.desktop

              install -m 755 \
                karaxes-shell.py \
                config/includes.chroot/usr/local/bin/karaxes-shell.py

              install -m 644 \
                karaxes-shell.desktop \
                config/includes.chroot/usr/share/applications/karaxes-shell.desktop

              lb config \
                --mode debian \
                --ignore-system-defaults \
                --distribution trixie \
                --architectures amd64 \
                --linux-flavours amd64 \
                --linux-packages linux-image \
                --binary-images iso-hybrid \
                --archive-areas "main contrib non-free non-free-firmware" \
                --mirror-bootstrap https://deb.debian.org/debian \
                --mirror-chroot https://deb.debian.org/debian \
                --mirror-binary https://deb.debian.org/debian \
                --mirror-chroot-security https://security.debian.org/debian-security \
                --security true \
                --debian-installer false \
                --iso-application "KARAXES OS X6" \
                --iso-volume "KARAXES_X6"

              lb build

              ISO=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)

              test -n "$ISO"

              cp "$ISO" output/KARAXES-OS-X6.iso

              cd output

              sha256sum KARAXES-OS-X6.iso > SHA256SUMS.txt

              ls -lh
              file KARAXES-OS-X6.iso
            '

      - name: Upload KARAXES ISO
        uses: actions/upload-artifact@v4
        with:
          name: KARAXES-OS-X6-ISO
          path: |
            output/KARAXES-OS-X6.iso
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
