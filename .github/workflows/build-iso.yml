
name: KARAXES OS X6 ISO Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            xorriso \
            squashfs-tools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            syslinux \
            syslinux-common \
            isolinux \
            mtools \
            dosfstools

      - name: Prepare KARAXES configuration
        run: |
          sudo rm -rf config
          mkdir -p config/package-lists
          mkdir -p config/archives

          cat > config/package-lists/karaxes.list.chroot <<'EOF'
          live-boot
          live-config
          live-config-systemd
          linux-image-amd64
          firmware-linux
          firmware-linux-nonfree
          firmware-misc-nonfree
          network-manager
          sudo
          systemd
          systemd-sysv
          xfce4
          xfce4-terminal
          lightdm
          firefox-esr
          thunar
          mousepad
          gvfs
          pavucontrol
          alsa-utils
          pipewire
          wireplumber
          fonts-dejavu
          locales
          EOF

          cat > config/archives/debian-security.list.chroot <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

      - name: Configure Debian Live
        run: |
          sudo lb config \
            --mode debian \
            --ignore-system-defaults \
            --distribution trixie \
            --architectures amd64 \
            --linux-flavours amd64 \
            --linux-packages linux-image \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --security false \
            --debian-installer false \
            --iso-application "KARAXES OS X6" \
            --iso-volume "KARAXES_X6"

      - name: Build ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          ISO=$(find . -maxdepth 1 -type f -name "*.iso" | head -n 1)
          test -n "$ISO"
          ls -lh "$ISO"
          file "$ISO"
          sha256sum "$ISO" > SHA256SUMS.txt

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: KARAXES-OS-X6-ISO
          path: |
            *.iso
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
